# mango config — migrated from ~/.config/hypr (Hyprland Lua config)
# Docs: https://github.com/DreamMaoMao/mango/wiki   Validate: mango -c ~/.config/mango/config.toml -p
# NOTE: all top-level options must come before the first [bind.*] / [[rule.*]] table.

[global]
source = ["./binds.toml", "./rules.toml"]
# wallust writes this on every wallpaper change (template: wallust/templates/colors-mango.toml)
source_optional = ["./wallust.toml"]

exec_once = [
  "systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP MANGO_INSTANCE_SIGNATURE",
  "awww-daemon --format xrgb",
  "qs -n -p $HOME/.config/quickshell/sumi",
  "nm-applet --indicator",
  "blueman-applet",
  "systemctl --user start hyprpolkitagent",
  "wl-paste --type text --watch cliphist store",
  "wl-paste --type image --watch cliphist store",
  "hypridle",
  "emacs --daemon",
  "sh -c 'sleep 3 && flatpak run com.protonvpn.www --start-minimized'",
]

# ---- Layouts (dwm-style dynamic tiling) ----
# switch_layout cycles only these (was ChangeLayout.sh: master <-> dwindle)
circle_layout = "dwindle,scroller"
new_is_master = 1
default_master_factor = 0.5
default_master_count = 1
tag_num = 9
smart_gaps = 0
dwindle_preserve_split = 1
dwindle_smart_split = 0
# new windows always go left / above, never by cursor position
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
monocle_tab_mode = 0
scroller_default_proportion = 1
scroller_structs = 8
scroller_proportion_preset = [0.5, 0.8, 0.95, 1.0]

# ---- Looks (was UserDecorations.lua) ----
border_px = 1
border_radius = 2
gap_inner_horizontal = 0
gap_inner_vertical = 0
gap_outer_horizontal = 4
gap_outer_vertical = 4
blur = 1
blur_layer = 1
# 0 = blur what's really behind (1 only blurs the wallpaper, hiding windows behind the launcher)
blur_optimized = 0
blur_params_num_passes = 2
blur_params_radius = 5
shadows = 0
focused_opacity = 1.0
unfocused_opacity = 0.9
dim_enable = 0
dim_focused_color = 0x00000000
dim_unfocused_color = 0x0000001a
# fallback colors; wallust.toml overrides them
border_color = 0x3b3d3fff
focus_color = 0x4f5154ff

# ---- Animations ----
animations = 1
layer_animations = 1
animation_type_open = "fade"
animation_type_close = "none"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
animation_duration_move = 300
animation_duration_open = 250
animation_duration_tag = 300
animation_duration_close = 250
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]

# ---- Overview (replaces quickshell modules/overview) ----
overview_gap_inner = 5
overview_gap_outer = 30

# ---- Behaviour (was UserSettings.lua) ----
focus_on_activate = 0
# SUPER+N on the current tag goes back to the previous tag
view_current_to_back = 1
sloppy_focus = 1
warp_cursor = 0
cursor_size = 28
idle_inhibit_when_fullscreen = 1
# tearing only for windows with force_tearing (games, see rules.toml)
allow_tearing = 1
drag_tile_to_tile = 1

# ---- Keyboard ----
repeat_rate = 50
repeat_delay = 300
numlock_on = 1
xkb_rules_layout = "us,ara"
xkb_rules_variant = ",qwerty"
xkb_rules_options = "grp:win_space_toggle,caps:escape"

# ---- Touchpad (relogin to apply) ----
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_middle_button_emulation = 0
gesture_swipe_distance = 500
gesture_swipe_cancel_ratio = 0.5
gesture_swipe_min_speed_to_force = 30

[env]
"XDG_CURRENT_DESKTOP" = "mango"
"XDG_SESSION_DESKTOP" = "mango"
"XDG_SESSION_TYPE" = "wayland"
"GDK_BACKEND" = "wayland,x11,*"
"QT_QPA_PLATFORM" = "wayland;xcb"
"CLUTTER_BACKEND" = "wayland"
"QT_AUTO_SCREEN_SCALE_FACTOR" = "1"
"QT_WAYLAND_DISABLE_WINDOWDECORATION" = "1"
"QT_QPA_PLATFORMTHEME" = "qt6ct"
"GDK_SCALE" = "1"
"QT_SCALE_FACTOR" = "1"
"XCURSOR_THEME" = "Nordzy-hyprcursors-white"
"XCURSOR_SIZE" = "28"
"MOZ_ENABLE_WAYLAND" = "1"
"ELECTRON_OZONE_PLATFORM_HINT" = "auto"
"LIBVA_DRIVER_NAME" = "nvidia"
"__GLX_VENDOR_LIBRARY_NAME" = "nvidia"
"NVD_BACKEND" = "direct"
"GSK_RENDERER" = "ngl"
"EDITOR" = "nvim"
